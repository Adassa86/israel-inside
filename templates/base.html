<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Israël Inside{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Israël Inside">
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Les offres</a>

        </nav>
    </div>
</header>

<main>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
    </div>

    {% block content %}{% endblock %}
</main>

<footer>
    <div class="container footer-inner">
        <strong>Israël Inside</strong>
        <span>Des opportunités simples à consulter.</span>
    </div>
</footer>
</body>
</html>
